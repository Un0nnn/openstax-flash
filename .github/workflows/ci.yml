name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python3 -m py_compile openstax_flash.py

      - name: CLI help
        run: python3 openstax_flash.py --help

      - name: List books (network smoke test)
        run: python3 openstax_flash.py list --query physics | head -5
