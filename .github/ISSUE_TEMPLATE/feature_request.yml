name: Feature request
description: Suggest an improvement or new export format
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe what you'd like and why it would help students using OpenStax flashcards.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do that the tool doesn't support today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
